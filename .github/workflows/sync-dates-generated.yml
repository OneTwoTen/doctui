name: Sync dates generated metadata

on:
  push:
    branches:
      - codex/issue-15-dates-visual-redesign

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: codex/issue-15-dates-visual-redesign
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate metadata
        run: bun run metadata:generate
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/components.json llms.txt llms-full.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync dates generated metadata"
          git push origin HEAD:codex/issue-15-dates-visual-redesign
