name: Sync issue 15 visual metadata

on:
  push:
    branches:
      - codex/issue-15-dates-visual-redesign

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-15-dates-visual-redesign

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate metadata artifacts
        run: bun run metadata:generate

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- metadata/components.json llms.txt llms-full.txt; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/components.json llms.txt llms-full.txt
          git commit -m "docs: sync redesigned date metadata"
          git push origin HEAD:codex/issue-15-dates-visual-redesign
