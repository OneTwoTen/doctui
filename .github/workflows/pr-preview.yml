name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    name: Build and deploy PR preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: pr-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ github.event.number }}/
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install PR dependencies
        run: bun install --frozen-lockfile

      - name: Build PR docs and Storybook
        env:
          DOCTUI_DOCS_BASE: /doctui/previews/pr-${{ github.event.number }}/docs/
          DOCTUI_STORYBOOK_BASE: /doctui/previews/pr-${{ github.event.number }}/storybook/
          DOCTUI_STORYBOOK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.number }}/storybook/
        run: bun run build

      - name: Prepare PR snapshot
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -rf pr-preview
          mkdir -p pr-preview/docs pr-preview/storybook
          cp -R apps/docs/.vitepress/dist/. pr-preview/docs/
          cp -R apps/storybook/storybook-static/. pr-preview/storybook/
          node scripts/generate-pr-preview.mjs page pr-preview

      - name: Store PR snapshot
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pr-previews
          publish_dir: ./pr-preview
          destination_dir: pr-${{ github.event.number }}
          full_commit_message: "preview: update PR #${{ github.event.number }}"

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          ref: main
          path: production

      - name: Install production dependencies
        working-directory: production
        run: bun install --frozen-lockfile

      - name: Build production docs and Storybook
        working-directory: production
        run: bun run build

      - name: Compose Pages artifact
        run: |
          rm -rf pages-site "${RUNNER_TEMP}/pr-previews"
          mkdir -p pages-site/storybook pages-site/previews
          cp -R production/apps/docs/.vitepress/dist/. pages-site/
          cp -R production/apps/storybook/storybook-static/. pages-site/storybook/

          git clone --depth 1 --branch pr-previews \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "${RUNNER_TEMP}/pr-previews"

          find "${RUNNER_TEMP}/pr-previews" -mindepth 1 -maxdepth 1 \
            -type d -name 'pr-*' -exec cp -R {} pages-site/previews/ \;

          node scripts/generate-pr-preview.mjs dashboard \
            pages-site/previews pages-site/previews/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create or update preview comment
        uses: actions/github-script@v8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- doctui-pr-preview -->";
            const root = process.env.PAGE_URL.endsWith("/")
              ? process.env.PAGE_URL
              : `${process.env.PAGE_URL}/`;
            const previewUrl = `${root}previews/pr-${context.issue.number}/`;
            const shortSha = process.env.PR_SHA.slice(0, 7);
            const body = `${marker}
            ## ✅ doctui PR preview

            Snapshot for commit \`${shortSha}\` is ready.

            - [Review page](${previewUrl})
            - [Docs](${previewUrl}docs/)
            - [Storybook](${previewUrl}storybook/)

            This comment is updated automatically when new commits are pushed.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    name: Remove closed PR preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: pr-preview
      url: ${{ steps.deployment.outputs.page_url }}previews/
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Remove snapshot from storage branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git ls-remote --exit-code origin refs/heads/pr-previews >/dev/null 2>&1; then
            exit 0
          fi

          git clone --depth 1 --branch pr-previews \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${RUNNER_TEMP}/pr-previews"
          cd "${RUNNER_TEMP}/pr-previews"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf "pr-${{ github.event.number }}"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "preview: remove PR #${{ github.event.number }}"
          git push origin pr-previews

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production docs and Storybook
        run: bun run build

      - name: Compose Pages artifact
        run: |
          rm -rf pages-site "${RUNNER_TEMP}/pr-previews-read"
          mkdir -p pages-site/storybook pages-site/previews
          cp -R apps/docs/.vitepress/dist/. pages-site/
          cp -R apps/storybook/storybook-static/. pages-site/storybook/

          if git ls-remote --exit-code origin refs/heads/pr-previews >/dev/null 2>&1; then
            git clone --depth 1 --branch pr-previews \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "${RUNNER_TEMP}/pr-previews-read"
            find "${RUNNER_TEMP}/pr-previews-read" -mindepth 1 -maxdepth 1 \
              -type d -name 'pr-*' -exec cp -R {} pages-site/previews/ \;
          fi

          node scripts/generate-pr-preview.mjs dashboard \
            pages-site/previews pages-site/previews/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Mark preview as removed
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- doctui-pr-preview -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n## 🧹 doctui PR preview\n\nThe preview was removed because this pull request is closed.`,
              });
            }
