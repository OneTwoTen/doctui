name: Temporary field metadata regeneration

on:
  push:
    branches:
      - codex/issue-8-field-contract

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-8-field-contract
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Patch canonical field metadata
        run: node scripts/patch-field-metadata.mjs
      - name: Format metadata source
        run: bun x biome format --write packages/core/src/component-metadata.ts scripts/generate-metadata.ts
      - name: Regenerate metadata artifacts
        run: bun run metadata:generate
      - name: Commit generated metadata
        run: |
          if git diff --quiet -- packages/core/src/component-metadata.ts metadata/components.json llms.txt llms-full.txt; then
            echo "Metadata already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/component-metadata.ts metadata/components.json llms.txt llms-full.txt
          git commit -m "docs(metadata): sync advanced field contract"
          git push origin HEAD:codex/issue-8-field-contract
