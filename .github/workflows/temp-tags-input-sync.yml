name: Temporary TagsInput contract sync

on:
  push:
    branches:
      - codex/issue-11-tags-input

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/issue-11-tags-input
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Patch TagsInput public contract
        run: node scripts/patch-tags-input-contract.mjs
      - name: Format changed sources
        run: bun x biome format --write packages/core/src/component-metadata.ts packages/core/src/styles.css apps/docs/.vitepress/config.mts
      - name: Regenerate metadata artifacts
        run: bun run metadata:generate
      - name: Commit synchronized contract
        run: |
          if git diff --quiet -- packages/core/src/component-metadata.ts packages/core/src/styles.css apps/docs/.vitepress/config.mts metadata/components.json llms.txt llms-full.txt; then
            echo "TagsInput contract already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/component-metadata.ts packages/core/src/styles.css apps/docs/.vitepress/config.mts metadata/components.json llms.txt llms-full.txt
          git commit -m "docs(metadata): sync TagsInput contract"
          git push origin HEAD:codex/issue-11-tags-input
