name: Issue 10 format

on:
  push:
    branches:
      - codex/issue-10-combobox

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(issue10): apply biome formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(issue10): apply biome formatting"
          git push
